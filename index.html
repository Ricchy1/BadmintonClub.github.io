/* ───── Shuttlecocks view ───── */
function ShuttlecocksView({ shuttlecocks, people, sessions, onAdd, onRemove, onUpdate, onTogglePayment, onAddPerson, onRemovePerson }) {
  const [statusFilter, setStatusFilter] = React.useState('all');
  // Budget = total $2 surcharges accrued across all sessions where an attended
  // person was not shuttle-covered on that session date.
  let accrued = 0;
  for (const date of Object.keys(sessions || {})) {
    const att = sessions[date].attendance || {};
    for (const pid of Object.keys(att)) {
      if (!att[pid]) continue;
      const person = people.find(p => p.id === pid);
      if (person && person.langdon) continue;
      if (!isCoveredOn(pid, date, shuttlecocks)) accrued += SHUTTLE_SURCHARGE;
    }
  }
  const totalApplied = shuttlecocks.reduce((sum, s) => sum + (Number(s.appliedSurcharge) || 0), 0);
  const budget = Math.max(0, accrued - totalApplied);

  const isShuttleFullyPaid = (s) => {
    const ids = s.personIds || people.map(p => p.id);
    const cardPeople = ids.map(pid => people.find(p => p.id === pid)).filter(Boolean);
    if (cardPeople.length === 0) return false;
    const pays = s.payments || {};
    return cardPeople.every(p => pays[p.id]);
  };
  const filteredShuttlecocks = shuttlecocks.filter(s => {
    if (statusFilter === 'all') return true;
    const paid = isShuttleFullyPaid(s);
    return statusFilter === 'paid' ? paid : !paid;
  });
  return (
    <div>
      <div className="budget-card">
        <div className="budget-label">
          <div className="budget-title">Budget</div>
          <div className="budget-sub">Accrued from +${SHUTTLE_SURCHARGE} surcharges in Sessions</div>
        </div>
        <div className="budget-amount mono">{money(budget)}</div>
      </div>

      <div className="shuttles-header">
        <div>
          <h2 style={{ margin: 0, fontSize: 17, fontWeight: 800, letterSpacing: '-0.015em' }}>Shuttlecocks</h2>
          <p style={{ margin: '2px 0 0', fontSize: 12.5, color: 'var(--ink-3)' }}>
            Track each shuttlecock purchase and who's paid their share.
          </p>
        </div>
        <div className="shuttles-header-actions">
          <StatusFilter value={statusFilter} onChange={setStatusFilter} />
          <button className="add-shuttle-btn" onClick={onAdd}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add shuttlecock
          </button>
        </div>
      </div>

      {shuttlecocks.length === 0 ? (
        <div className="shuttles-empty">
          <div className="shuttles-empty-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 2l3 8h-6l3-8z"/><circle cx="12" cy="14" r="5"/><path d="M9 19l-2 3M15 19l2 3M12 19v3"/>
            </svg>
          </div>
          <div style={{ fontWeight: 600, marginBottom: 4 }}>No shuttlecocks logged yet</div>
          <div style={{ fontSize: 12.5, color: 'var(--ink-3)', marginBottom: 14 }}>
            Add a card for each tube or batch you buy.
          </div>
          <button className="add-shuttle-btn" onClick={onAdd}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add shuttlecock
          </button>
        </div>
      ) : (
        <div className="shuttles-grid">
          {filteredShuttlecocks.length === 0 ? (
            <div className="filter-empty">
              {statusFilter === 'paid' ? 'No fully-paid shuttlecocks yet.' : 'No outstanding shuttlecocks.'}
            </div>
          ) : filteredShuttlecocks.map(s => (
            <ShuttlecockCard
              key={s.id}
              shuttle={s}
              people={people}
              sessions={sessions}
              allShuttlecocks={shuttlecocks}
              onRemove={() => onRemove(s.id)}
              onUpdate={(field, value) => onUpdate(s.id, field, value)}
              onTogglePayment={(pid) => onTogglePayment(s.id, pid)}
              onAddPerson={(pid) => onAddPerson(s.id, pid)}
              onRemovePerson={(pid) => onRemovePerson(s.id, pid)}
            />
          ))}
        </div>
        {shuttlecocks.length > 0 && (
          <div style={{
            marginTop: 18, padding: '14px 18px',
            background: 'var(--surface)', border: '1px solid var(--line)',
            borderRadius: 'var(--radius)', boxShadow: 'var(--shadow)',
            display: 'flex', alignItems: 'center', gap: 28, flexWrap: 'wrap',
          }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
              <span style={{ fontSize: 10.5, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 700 }}>Total Shuttlecock Cost</span>
              <span className="mono" style={{ fontSize: 22, fontWeight: 800 }}>
                {money(shuttlecocks.reduce((sum, s) => sum + (Number(s.cost) || 0), 0))}
              </span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
              <span style={{ fontSize: 10.5, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 700 }}>Shuttlecocks</span>
              <span className="mono" style={{ fontSize: 22, fontWeight: 800 }}>{shuttlecocks.length}</span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
              <span style={{ fontSize: 10.5, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 700 }}>Fully Paid</span>
              <span className="mono" style={{ fontSize: 22, fontWeight: 800, color: shuttlecocks.filter(isShuttleFullyPaid).length === shuttlecocks.length ? '#16a34a' : 'var(--ink)' }}>
                {shuttlecocks.filter(isShuttleFullyPaid).length}/{shuttlecocks.length}
              </span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
              <span style={{ fontSize: 10.5, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 700 }}>Avg Cost</span>
              <span className="mono" style={{ fontSize: 22, fontWeight: 800 }}>
                {money(shuttlecocks.reduce((sum, s) => sum + (Number(s.cost) || 0), 0) / shuttlecocks.length)}
              </span>
            </div>
          </div>
        )}
      )}
    </div>
  );
}

function ShuttlecockCard({ shuttle, people, sessions, allShuttlecocks, onRemove, onUpdate, onTogglePayment, onAddPerson, onRemovePerson }) {
  const payments = shuttle.payments || {};
  const cost = Number(shuttle.cost) || 0;
  const applied = Number(shuttle.appliedSurcharge) || 0;
  // Back-compat: if personIds missing, include all current people
  const personIds = shuttle.personIds || people.map(p => p.id);
  const cardPeople = personIds.map(pid => people.find(p => p.id === pid)).filter(Boolean);
  const remaining = Math.max(0, cost - applied);
  const split = cardPeople.length > 0 ? remaining / cardPeople.length : 0;
  const paidPeople = cardPeople.filter(p => payments[p.id]);
  const paidCount = paidPeople.length;
  const paidAmount = paidPeople.length * split;
  const fullyPaid = cardPeople.length > 0 && paidCount === cardPeople.length;
  const eligibleToAdd = people.filter(p => !personIds.includes(p.id));
  const [showAdd, setShowAdd] = React.useState(false);

  // Available surcharge pool: sum of +$2 across attended sessions on or before this
  // card's date where the attendee was not shuttle-covered on that session,
  // minus what's already been applied by OTHER shuttlecock cards.
  const cutoff = shuttle.date || isoDate(new Date());
  let accruedHere = 0;
  for (const d of Object.keys(sessions || {})) {
    if (d > cutoff) continue;
    const att = sessions[d].attendance || {};
    for (const pid of Object.keys(att)) {
      if (!att[pid]) continue;
      const person = people.find(p => p.id === pid);
      if (person && person.langdon) continue;
      if (!isCoveredOn(pid, d, allShuttlecocks)) accruedHere += SHUTTLE_SURCHARGE;
    }
  }
  const appliedElsewhere = (allShuttlecocks || []).reduce((sum, s) => s.id === shuttle.id ? sum : sum + (Number(s.appliedSurcharge) || 0), 0);
  const pool = Math.max(0, accruedHere - appliedElsewhere);
  const canApply = pool > 0 && applied < pool;
  const applySurcharge = () => onUpdate('appliedSurcharge', applied + pool);
  const clearSurcharge = () => onUpdate('appliedSurcharge', 0);
  const [costStr, setCostStr] = React.useState(shuttle.cost ? String(shuttle.cost) : '');
  React.useEffect(() => { setCostStr(shuttle.cost ? String(shuttle.cost) : ''); }, [shuttle.id, shuttle.cost]);
  const onCostChange = (e) => {
    const v = e.target.value.replace(/[^\d.]/g, '');
    setCostStr(v);
    onUpdate('cost', parseFloat(v) || 0);
  };

  return (
    <section className={`shuttle-card ${fullyPaid ? 'is-fully-paid' : ''}`}>
      {fullyPaid && <div className="fully-paid-banner">FULLY PAID</div>}
      <div className="shuttle-head">
        <div className="shuttle-fields">
          <textarea
            className="shuttle-name"
            value={shuttle.name}
            onChange={(e) => onUpdate('name', e.target.value)}
            placeholder="Shuttlecock name…"
            rows={1}
          />
          <input
            className="shuttle-date mono"
            type="date"
            value={shuttle.date || ''}
            onChange={(e) => onUpdate('date', e.target.value)}
          />
        </div>
        <button
          className="icon-btn shuttle-remove"
          onClick={() => { if (window.confirm('Remove this shuttlecock?')) onRemove(); }}
          data-tip="Remove shuttlecock"
          aria-label="Remove shuttlecock"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>

      <div className="court-row">
        <label htmlFor={`cost-${shuttle.id}`}>Total cost</label>
        <div className="court-input-wrap">
          <span className="prefix">$</span>
          <input
            id={`cost-${shuttle.id}`}
            className="court-input"
            type="text"
            inputMode="decimal"
            value={costStr}
            onChange={onCostChange}
            placeholder="0.00"
          />
        </div>
      </div>

      <div className="surcharge-row">
        {applied > 0 ? (
          <>
            <div className="surcharge-info">
              <div className="surcharge-info-label">Applied from surcharge pool</div>
              <div className="surcharge-info-amount mono">−{money(applied)}</div>
            </div>
            <button className="surcharge-btn clear" onClick={clearSurcharge}>Undo</button>
          </>
        ) : (
          <>
            <div className="surcharge-info">
              <div className="surcharge-info-label">Surcharge pool available</div>
              <div className="surcharge-info-amount mono">{money(pool)}</div>
            </div>
            <button className="surcharge-btn" onClick={applySurcharge} disabled={!canApply}>Apply to cost</button>
          </>
        )}
      </div>

      <ul className="roster-list">
        {cardPeople.length === 0 && (
          <li className="roster-empty" style={{ padding: '18px' }}>
            No one on this card yet.<br/>
            {eligibleToAdd.length > 0 && (
              <button onClick={() => setShowAdd(true)} style={{ marginTop: 8 }}>+ Add a player</button>
            )}
          </li>
        )}
        {cardPeople.map(p => {
          const paid = !!payments[p.id];
          return (
            <li key={p.id} className={`roster-item ${paid ? 'is-paid attended' : ''}`}>
              <div className="person-name" style={{ gridColumn: '1 / span 2' }}>{p.name}</div>
              <div className={`person-cost ${cost > 0 ? '' : 'dim'}`}>
                {cost > 0 ? money(split) : '—'}
              </div>
              <button
                className={`pay-check ${paid ? 'on' : ''}`}
                onClick={() => onTogglePayment(p.id)}
                aria-pressed={paid}
                data-tip={paid ? 'Paid · click to unmark' : 'Mark as paid'}
                aria-label={`Toggle paid for ${p.name}`}
              >
                {paid ? (
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                ) : (
                  <span className="pay-dash">$</span>
                )}
              </button>
              <button
                className="drop-btn"
                onClick={() => { if (window.confirm(`Remove ${p.name || 'this player'} from this shuttlecock?`)) onRemovePerson(p.id); }}
                data-tip="Remove from this card"
                aria-label={`Remove ${p.name} from this card`}
                style={{ gridColumn: '5', marginLeft: 0 }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </li>
          );
        })}
      </ul>

      <div className="day-actions shuttle-roster-actions" style={{ borderTop: '1px solid var(--line)', borderBottom: 0 }}>
        {eligibleToAdd.length > 0 ? (
          <div style={{ position: 'relative' }}>
            <button className="day-action" onClick={() => setShowAdd(v => !v)}>+ Add player</button>
            {showAdd && (
              <QuickAddDropdown
                people={eligibleToAdd}
                onPick={(pid) => { onAddPerson(pid); setShowAdd(false); }}
                onClose={() => setShowAdd(false)}
              />
            )}
          </div>
        ) : (
          <span style={{ fontSize: 11.5, color: 'var(--ink-3)' }}>All players added</span>
        )}
        {cardPeople.length > 0 && (
          <button
            className="day-action danger"
            onClick={() => {
              if (window.confirm(`Remove all ${cardPeople.length} ${cardPeople.length === 1 ? 'player' : 'players'} from this card?`)) {
                onUpdate('personIds', []);
              }
            }}
          >
            Remove all
          </button>
        )}
      </div>

      <div className="day-foot">
        <span className="label">Base split</span>
        <span className="value mono">{remaining > 0 && cardPeople.length > 0 ? money(split) : '—'}</span>
        {applied > 0 && (
          <>
            <span className="label" style={{ color: 'var(--warn)' }}>Less surcharge</span>
            <span className="value mono" style={{ color: 'var(--warn)' }}>−{money(applied)}</span>
          </>
        )}
        <span className="label">Collected</span>
        <span className="value mono">{paidCount} / {cardPeople.length} · {money(paidAmount)}</span>
        <span className="label">Total</span>
        <span className="value big mono">{money(remaining)}</span>
      </div>
    </section>
  );
}

/* ───── Mount ───── */
/* ───── History view ───── */
function HistoryView({ sessions, people, shuttlecocks }) {
  const [dayFilter, setDayFilter] = React.useState('all'); // 'all', 'tue', 'wed', 'sat'

  const sortedDates = Object.keys(sessions).sort().reverse();
  const activeDates = sortedDates.filter(date => {
    const att = sessions[date].attendance || {};
    return Object.values(att).some(Boolean);
  });

  // Apply day filter
  const filteredDates = activeDates.filter(date => {
    if (dayFilter === 'all') return true;
    const [Y, M, D] = date.split('-').map(Number);
    const dow = new Date(Y, M - 1, D).getDay();
    const dayInfo = DAYS.find(dd => dd.dow === dow);
    return dayInfo && dayInfo.key === dayFilter;
  });

  let totalCourt = 0, totalSessions = 0, totalPlayerSessions = 0, totalPaid = 0, totalAttendees = 0;

  const rows = filteredDates.map(date => {
    const sess = sessions[date];
    const att = sess.attendance || {};
    const pays = sess.payments || {};
    const courtHire = Number(sess.courtHire) || 0;
    const attendeeIds = Object.keys(att).filter(pid => att[pid]);
    const attendeeCount = attendeeIds.length;
    const paidCount = attendeeIds.filter(pid => pays[pid]).length;
    const baseSplit = attendeeCount > 0 && courtHire > 0 ? courtHire / attendeeCount : 0;

    let surchargeTotal = 0;
    attendeeIds.forEach(pid => {
      const person = people.find(p => p.id === pid);
      if (person && person.langdon) return;
      if (!isCoveredOn(pid, date, shuttlecocks)) surchargeTotal += SHUTTLE_SURCHARGE;
    });

    const dayTotal = courtHire + surchargeTotal;
    const [Y, M, D] = date.split('-').map(Number);
    const d = new Date(Y, M - 1, D);
    const dow = d.getDay();
    const dayInfo = DAYS.find(dd => dd.dow === dow);
    const dayLabel = dayInfo ? dayInfo.short : d.toLocaleDateString(undefined, { weekday: 'short' });
    const dateStr = `${pad(D)}/${pad(M)}/${Y}`;

    totalCourt += courtHire;
    totalSessions++;
    totalPlayerSessions += attendeeCount;
    totalPaid += paidCount;
    totalAttendees += attendeeCount;

    return { date, dayLabel, dateStr, courtHire, attendeeCount, paidCount, baseSplit, surchargeTotal, dayTotal };
  });

  const filterBtns = [
    { key: 'all', label: 'All' },
    ...DAYS.map(d => ({ key: d.key, label: d.short })),
  ];

  return (
    <div className="history-panel">
      <div className="history-panel-head">
        <div>
          <h2>Session History</h2>
          <p>All recorded sessions, most recent first.</p>
        </div>
      </div>
      <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--line)', display: 'flex', gap: 6, flexWrap: 'wrap' }}>
        {filterBtns.map(f => (
          <button
            key={f.key}
            className={`day-filter-chip ${dayFilter === f.key ? 'active' : ''}`}
            onClick={() => setDayFilter(f.key)}
            style={{
              padding: '6px 14px',
              borderRadius: 999,
              border: '1px solid ' + (dayFilter === f.key ? 'var(--ink)' : 'var(--line-2)'),
              background: dayFilter === f.key ? 'var(--ink)' : 'var(--surface)',
              color: dayFilter === f.key ? 'var(--accent)' : 'var(--ink-2)',
              fontSize: 13,
              fontWeight: 700,
              cursor: 'pointer',
            }}
          >
            {f.label}
          </button>
        ))}
      </div>
      {rows.length === 0 ? (
        <div className="history-empty">No sessions recorded{dayFilter !== 'all' ? ` for ${filterBtns.find(f => f.key === dayFilter)?.label}` : ''}.</div>
      ) : (
        <>
          <table className="history-table">
            <thead>
              <tr>
                <th style={{ width: '10%' }}>Day</th>
                <th>Date</th>
                <th className="right">Court</th>
                <th className="right">Attended</th>
                <th className="right">Split</th>
                <th style={{ textAlign: 'center' }}>Paid</th>
                <th className="right">Total</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => {
                const allPaid = r.paidCount === r.attendeeCount && r.attendeeCount > 0;
                return (
                  <tr key={r.date}>
                    <td className="history-day-label">{r.dayLabel}</td>
                    <td className="history-date">{r.dateStr}</td>
                    <td className="right mono">{money(r.courtHire)}</td>
                    <td className="right mono">{r.attendeeCount}</td>
                    <td className="right mono">{r.baseSplit > 0 ? money(r.baseSplit) : '—'}</td>
                    <td style={{ textAlign: 'center' }}>
                      <span className={`paid-ratio ${allPaid ? 'all-paid' : ''}`}>
                        <span className="mono" style={{ color: allPaid ? '#16a34a' : '#dc2626', fontWeight: 700 }}>{r.paidCount}/{r.attendeeCount}</span>
                        <span className="bar"><span className="bar-fill" style={{ width: `${r.attendeeCount > 0 ? (r.paidCount / r.attendeeCount) * 100 : 0}%`, background: allPaid ? '#16a34a' : '#f59e0b' }} /></span>
                      </span>
                    </td>
                    <td className="right mono" style={{ fontWeight: 700 }}>{money(r.dayTotal)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="history-summary">
            <div className="hs-item"><span className="hs-label">Sessions</span><span className="hs-value">{totalSessions}</span></div>
            <div className="hs-item"><span className="hs-label">Court Hire</span><span className="hs-value">{money(totalCourt)}</span></div>
            <div className="hs-item"><span className="hs-label">Player-Sessions</span><span className="hs-value">{totalPlayerSessions}</span></div>
            <div className="hs-item"><span className="hs-label">Paid</span><span className="hs-value" style={{ color: totalPaid === totalAttendees && totalAttendees > 0 ? '#16a34a' : '#dc2626' }}>{totalPaid}/{totalAttendees}</span></div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
