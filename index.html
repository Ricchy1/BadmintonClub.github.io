<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Badminton Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f4ef;
      --bg-2: #ece9e0;
      --surface: #ffffff;
      --ink: #1a1a17;
      --ink-2: #4a4a44;
      --ink-3: #8a8a82;
      --line: #e1ddd2;
      --line-2: #d3cec0;
      /* court-green accent */
      --accent: oklch(70% 0.16 140);
      --accent-ink: oklch(28% 0.06 140);
      --accent-soft: oklch(94% 0.05 140);
      --warn: oklch(65% 0.16 55);
      --warn-soft: oklch(95% 0.04 70);
      --danger: oklch(58% 0.18 28);
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 1px 0 rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum' 1; }
    button { font-family: inherit; cursor: pointer; }
    input, button { font-family: inherit; color: inherit; }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 28px 80px;
    }

    /* ───── Header ───── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--ink);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .brand-title {
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.01em;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: -2px;
    }

    .week-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .week-nav {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .week-nav button {
      border: 0;
      background: transparent;
      width: 32px; height: 32px;
      border-radius: 999px;
      display: grid; place-items: center;
      color: var(--ink-2);
    }
    .week-nav button:hover { background: var(--bg-2); color: var(--ink); }
    .week-label {
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.005em;
      min-width: 200px;
      text-align: center;
    }
    .week-label .small { color: var(--ink-3); font-weight: 500; margin-left: 6px; }
    .today-pill {
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .today-pill:hover:not(:disabled) { filter: brightness(0.96); }
    .today-pill:disabled {
      background: var(--surface);
      color: var(--ink-3);
      border-color: var(--line);
      cursor: default;
    }

    /* ───── Tabs (Sessions vs Roster) ───── */
    .tabs {
      display: inline-flex;
      gap: 2px;
      background: var(--bg-2);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 22px;
    }
    .tab {
      border: 0;
      background: transparent;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13.5px;
      color: var(--ink-2);
      letter-spacing: -0.005em;
    }
    .tab.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .tab .count {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: var(--bg-2);
      color: var(--ink-3);
      padding: 1px 6px;
      border-radius: 6px;
      margin-left: 6px;
      font-weight: 500;
    }
    .tab.active .count { background: var(--bg); color: var(--ink-2); }

    /* ───── Sessions grid ───── */
    .sessions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .sessions.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 760px; }
    .sessions.cols-1 { grid-template-columns: minmax(0, 380px); }
    .sessions.cols-0 { grid-template-columns: 1fr; }
    @media (max-width: 980px) {
      .sessions, .sessions.cols-2, .sessions.cols-1 { grid-template-columns: 1fr; max-width: none; }
    }

    .day-filters {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .day-filters-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-right: 4px;
    }
    .day-filter-chip {
      border: 1px solid var(--line-2);
      background: var(--surface);
      color: var(--ink-3);
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: -0.005em;
      transition: all 0.12s ease;
    }
    .day-filter-chip:hover { color: var(--ink); border-color: var(--ink-2); }
    .day-filters-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .shuttles-header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .status-filter {
      display: inline-flex;
      align-items: stretch;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .status-chip {
      border: 0;
      background: transparent;
      color: var(--ink-3);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: -0.005em;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.12s ease;
      white-space: nowrap;
    }
    .status-chip:hover { color: var(--ink); }
    .status-chip.on {
      background: var(--ink);
      color: white;
    }
    .filter-empty {
      grid-column: 1 / -1;
      padding: 40px 20px;
      text-align: center;
      color: var(--ink-3);
      font-size: 13px;
      font-weight: 600;
      background: var(--surface);
      border: 1px dashed var(--line-2);
      border-radius: 12px;
    }
    .roster-panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .bulk-shuttle-btn {
      padding: 8px 14px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--accent);
      border-radius: 8px;
      font-weight: 700;
      font-size: 12.5px;
      letter-spacing: -0.005em;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .bulk-shuttle-btn:hover { background: #000; border-color: #000; }
    .coverage-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: -0.005em;
    }
    .coverage-badge.on { background: #e8f5ec; color: #1f7a3a; }
    .coverage-badge.off { background: #fff3e6; color: #b9551b; }
    .owed-cell { padding-right: 16px !important; }
    .owed-amount { color: var(--danger); font-weight: 700; }
    .name-cell { display: flex; align-items: center; gap: 8px; }
    .focus-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid var(--line-2); background: transparent;
      cursor: pointer; padding: 0; flex-shrink: 0;
      transition: all 120ms ease;
    }
    .focus-dot:hover { border-color: var(--ink-2); background: var(--ink-4); }
    .focus-dot.on { border-color: var(--ink); background: var(--ink); box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }
    .row-focused { background: #fafaf7; }
    .row-dimmed { display: none; }
    .focus-banner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 14px; margin-bottom: 12px;
      background: #f7f7f2; border: 1px solid var(--line-2); border-radius: 8px;
      font-size: 13px; color: var(--ink);
    }
    .focus-banner-clear {
      border: 0; background: transparent; cursor: pointer;
      font: inherit; color: var(--ink-2); font-weight: 600;
      padding: 4px 8px; border-radius: 6px;
    }
    .focus-banner-clear:hover { background: var(--ink-4); color: var(--ink); }
    .owed-btn { border: 0; background: transparent; padding: 4px 6px; cursor: pointer; font: inherit; border-radius: 6px; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
    .owed-btn:hover { background: #fef0f0; }
    .owed-popover { position: absolute; right: 12px; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); width: max-content; max-width: min(520px, calc(100vw - 48px)); z-index: 50; padding: 10px 14px; text-align: left; }
    .owed-row { white-space: nowrap; }
    .owed-popover-title { font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
    .owed-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 13px; }
    .owed-row:first-child { border-top: 0; }
    .owed-row-label { color: var(--ink); font-weight: 600; }
    .owed-row-amt { color: var(--ink); font-weight: 700; }
    .owed-row-sur { color: var(--warn); font-weight: 600; font-size: 11.5px; margin-left: 4px; }
    .owed-total { color: var(--danger); font-weight: 800; font-size: 14px; }
    .owed-zero { color: var(--ink-3); }
    .people-table th.right { text-align: right; padding-right: 16px; }
    .shuttle-roster-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .day-action.danger {
      color: var(--danger);
      border-color: var(--line-2);
    }
    .day-action.danger:hover { border-color: var(--danger); background: #fef5f5; }
    .day-filter-chip.on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--accent);
    }
    .sessions-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--ink-3);
      font-size: 13px;
      background: var(--surface);
      border: 1px dashed var(--line-2);
      border-radius: var(--radius);
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .day-card.is-today { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
    .day-card.is-past { opacity: 0.92; }

    .day-head {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .day-name {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.015em;
    }
    .day-date {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 2px;
    }
    .day-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--bg-2);
      color: var(--ink-2);
    }
    .day-tag.today { background: var(--accent); color: var(--accent-ink); }
    .day-tag.past { background: var(--bg); color: var(--ink-3); }

    .court-row {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .court-row label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      letter-spacing: -0.005em;
    }
    .court-input-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .court-input-wrap .prefix {
      position: absolute;
      left: 10px;
      color: var(--ink-3);
      font-size: 13px;
      pointer-events: none;
    }
    .court-input {
      width: 110px;
      padding: 7px 10px 7px 22px;
      border: 1px solid var(--line-2);
      background: var(--surface);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 600;
      text-align: right;
      outline: none;
    }
    .court-input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }

    .roster-list {
      list-style: none;
      margin: 0;
      padding: 6px 0;
      flex: 1;
      min-height: 60px;
    }
    .roster-empty {
      padding: 22px 18px;
      text-align: center;
      color: var(--ink-3);
      font-size: 12.5px;
    }
    .roster-empty button {
      margin-top: 8px;
      border: 1px dashed var(--line-2);
      background: transparent;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
    }
    .roster-empty button:hover { border-color: var(--ink); color: var(--ink); }

    .roster-item {
      display: grid;
      grid-template-columns: 22px 1fr auto 26px;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-bottom: 1px dashed var(--line);
    }
    .pay-check {
      width: 26px; height: 26px;
      padding: 0;
      border-radius: 999px;
      border: 1.5px dashed var(--line-2);
      background: var(--surface);
      color: var(--ink-3);
      display: grid; place-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
      padding: 0;
    }
    .pay-check:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); border-style: solid; }
    .pay-check.on {
      background: var(--accent);
      border-color: var(--accent);
      border-style: solid;
      color: var(--accent-ink);
    }
    .pay-check.on svg { width: 13px; height: 13px; }
    .pay-check:disabled { opacity: 0.35; cursor: not-allowed; }
    .pay-check .pay-dash { line-height: 1; }
    .roster-item.is-paid .person-cost,
    .roster-item.is-paid .person-cost .surcharge {
      color: var(--accent-ink);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      text-decoration-color: color-mix(in oklab, var(--accent-ink) 60%, transparent);
    }
    .roster-item:last-child { border-bottom: 0; }
    .roster-item.attended { background: var(--accent-soft); }

    .check {
      width: 22px; height: 22px;
      padding: 0;
      border-radius: 7px;
      border: 1.5px solid var(--line-2);
      background: var(--surface);
      display: grid; place-items: center;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .check:hover { border-color: var(--ink); }
    .check.on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--accent);
    }
    .check svg { width: 14px; height: 14px; opacity: 0; }
    .check.on svg { opacity: 1; }

    .person-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.005em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .person-name.dim { color: var(--ink-3); font-weight: 500; }
    .shuttle-flag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--warn-soft);
      color: var(--warn);
      cursor: help;
    }

    .person-cost {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 13.5px;
      color: var(--ink);
      min-width: 64px;
      text-align: right;
    }
    .person-cost.dim { color: var(--ink-3); font-weight: 500; }
    .person-cost .surcharge { color: var(--warn); font-size: 10.5px; display: block; line-height: 1; margin-top: 1px; font-weight: 600; }

    .day-foot {
      padding: 12px 18px 14px;
      border-top: 1px solid var(--line);
      background: var(--bg);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      align-items: baseline;
    }
    .day-foot .label { font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.02em; text-transform: uppercase; font-weight: 600; }
    .day-foot .value { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; text-align: right; }
    .day-foot .value.big { font-size: 16px; }

    /* ───── Roster tab ───── */
    .roster-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: visible;
    }
    .roster-panel-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .roster-panel-head h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.015em;
    }
    .roster-panel-head p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--ink-3);
    }

    .add-person {
      display: flex;
      gap: 6px;
      padding: 14px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .add-person input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--line-2);
      background: var(--surface);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .add-person input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }
    .add-person button {
      padding: 8px 16px;
      border: 0;
      background: var(--ink);
      color: var(--accent);
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }
    .add-person button:hover { background: #000; }
    .add-person button:disabled { opacity: 0.4; cursor: not-allowed; }

    .people-table {
      width: 100%;
      border-collapse: collapse;
    }
    .people-table thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .people-table thead th.center { text-align: center; }
    .people-table tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .people-table tbody tr:last-child td { border-bottom: 0; }
    .people-table tbody tr:hover { background: var(--bg); }

    .name-cell {
      font-weight: 600;
      font-size: 14.5px;
      letter-spacing: -0.005em;
    }
    .name-cell input {
      width: 100%;
      max-width: 240px;
      border: 0;
      background: transparent;
      font: inherit;
      padding: 4px 6px;
      border-radius: 6px;
      outline: none;
      margin-left: -6px;
    }
    .name-cell input:hover { background: var(--bg-2); }
    .name-cell input:focus { background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }

    .day-toggles {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .day-chip {
      width: 36px; height: 28px;
      border-radius: 7px;
      border: 1px solid var(--line-2);
      background: var(--surface);
      color: var(--ink-3);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: grid;
      place-items: center;
    }
    .day-chip:hover { border-color: var(--ink-2); color: var(--ink-2); }
    .day-chip.on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--accent);
    }

    .toggle-shuttle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-track {
      width: 36px; height: 20px;
      background: var(--line-2);

/* Badminton Tracker — single-file React app

const { useState, useEffect, useMemo, useRef } = React;

/* ═══════════════════════════════════════════════ */
const SUPABASE_URL = 'https://kgainkqtzfnejbixdpzt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnYWlua3F0emZuZWpiaXhkcHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzOTQ1MzIsImV4cCI6MjA5Mzk3MDUzMn0.NF6-ro2USBWzo2Gpujd4oQTpPbxlK8ICBoSSKAjgiu0';

const DAYS = [

  { key: 'sat', label: 'Saturday',  short: 'Sat', dow: 6 },
];
const SHUTTLE_SURCHARGE = 2;

/**
 * Is the given person "shuttle-covered" on the given session date?
 * Rule: look at all shuttlecock cards with date <= sessionDate; pick the most
 * recent one (ties broken by later array position). If that card's personIds
 * includes the person, they're covered — no +$2 surcharge for this session.
 */
function isCoveredOn(personId, sessionDateISO, shuttlecocks) {
  if (!shuttlecocks || shuttlecocks.length === 0 || !sessionDateISO) return false;
  let latest = null;
  let latestIdx = -1;
  shuttlecocks.forEach((s, idx) => {
    if (!s.date || s.date > sessionDateISO) return;
    if (!latest || s.date > latest.date || (s.date === latest.date && idx > latestIdx)) {
      latest = s;
      latestIdx = idx;
    }
  });
  if (!latest) return false;
  const ids = latest.personIds || [];
  return ids.includes(personId);
}

/* ───── Date utils ───── */
const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoDate(new Date());
function startOfWeek(d) {
  // Monday-start week
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  const day = x.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day);
  x.setDate(x.getDate() + diff);
  return x;
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
function dateForDayOfWeek(weekStart, dow) {
  // weekStart = Monday; dow as JS getDay()
  const offset = dow === 0 ? 6 : dow - 1;
  return addDays(weekStart, offset);
}
function fmtMonthDay(d) {
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function fmtWeekRange(start) {
  const end = addDays(start, 6);
  const sameMonth = start.getMonth() === end.getMonth();
  const startStr = sameMonth
    ? start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    : start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const endStr = end.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  return `${startStr} – ${endStr}`;
}

    return data ? data.data : null;

}
let _saveTimer = null;
function saveStateToDB(s) {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    try {
      const { error } = await supabase.from('app_state').upsert({ id: DB_ROW_ID, data: s, updated_at: new Date().toISOString() });

}

/* Seed state — small example so the app isn't empty on first load */
function seed() {

  return {
    people: [
      { id: id(), name: 'Alex',     shuttlePaid: true,  days: ['tue', 'sat'] },
      { id: id(), name: 'Bea',      shuttlePaid: true,  days: ['tue', 'wed', 'sat'] },
      { id: id(), name: 'Chen',     shuttlePaid: false, days: ['wed'] },
      { id: id(), name: 'Devi',     shuttlePaid: true,  days: ['sat'] },
      { id: id(), name: 'Eli',      shuttlePaid: false, days: ['tue', 'wed'] },
      { id: id(), name: 'Farah',    shuttlePaid: true,  days: ['sat'] },
    ],
    sessions: {}, // { 'YYYY-MM-DD': { courtHire: number, attendance: { personId: bool }, payments: { personId: bool } } }
    shuttlecocks: [], // [{ id, name, date, payments: { personId: bool } }]
    activeTab: 'sessions',
  };
}

/* ───── App ───── */
function App() {
  const [state, setState] = useState(null);
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [tab, setTab] = useState('sessions');
  const [newName, setNewName] = useState('');
  const newNameRef = useRef(null);
  const skipNextRealtime = useRef(false);
  const loaded = useRef(false);

  // Load from Supabase on mount
  useEffect(() => {
    loadStateFromDB().then(data => {
      if (data) {
        setState(data);
        if (data.activeTab) setTab(data.activeTab);
      } else {
        const initial = seed();
        setState(initial);
        saveStateToDB(initial);
      }
      loaded.current = true;
    });
  }, []);

  // Save to Supabase on state change
  useEffect(() => {
    if (!state || !loaded.current) return;
    skipNextRealtime.current = true;
    saveStateToDB({ ...state, activeTab: tab });
  }, [state, tab]);

  // Realtime subscription
  useEffect(() => {
    const channel = supabase
      .channel('app_state_realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state', filter: `id=eq.${DB_ROW_ID}` },
        (payload) => {
          if (skipNextRealtime.current) { skipNextRealtime.current = false; return; }
          if (payload.new && payload.new.data) {
            setState(payload.new.data);
            if (payload.new.data.activeTab) setTab(payload.new.data.activeTab);
          }
        }
      ).subscribe();
    return () => { supabase.removeChannel(channel); };
  }, []);

  /* derived */
  const peopleById = useMemo(() => state ? Object.fromEntries(state.people.map(p => [p.id, p])) : {}, [state]);
  const todayIso = todayISO();

  /* mutators */
  const updatePeople = (fn) => setState(s => ({ ...s, people: fn(s.people) }));
  const updateSessions = (fn) => setState(s => ({ ...s, sessions: fn(s.sessions) }));
  const updateShuttlecocks = (fn) => setState(s => ({ ...s, shuttlecocks: fn(s.shuttlecocks || []) }));

  /* ── Shuttlecock mutators ── */
  function addShuttlecock() {
    const id = Math.random().toString(36).slice(2, 10);
    const today = isoDate(new Date());
    updateShuttlecocks(arr => [...arr, { id, name: '', date: today, cost: 0, payments: {}, personIds: state.people.map(p => p.id) }]);
  }
  function removeShuttlecock(id) {
    updateShuttlecocks(arr => arr.filter(s => s.id !== id));
  }
  function updateShuttlecockField(id, field, value) {
    updateShuttlecocks(arr => arr.map(s => s.id === id ? { ...s, [field]: value } : s));
  }
  function toggleShuttlecockPayment(id, personId) {
    updateShuttlecocks(arr => arr.map(s => {
      if (s.id !== id) return s;
      const pay = { ...(s.payments || {}) };
      pay[personId] = !pay[personId];
      return { ...s, payments: pay };
    }));
  }
  function addPersonToShuttlecock(id, personId) {
    updateShuttlecocks(arr => arr.map(s => {
      if (s.id !== id) return s;
      const cur = s.personIds || [];
      if (cur.includes(personId)) return s;
      return { ...s, personIds: [...cur, personId] };
    }));
  }
  function removePersonFromShuttlecock(id, personId) {
    updateShuttlecocks(arr => arr.map(s => {
      if (s.id !== id) return s;
      const cur = s.personIds || [];
      const { [personId]: _, ...rest } = s.payments || {};
      return { ...s, personIds: cur.filter(pid => pid !== personId), payments: rest };
    }));
  }

  function ensureSession(date) {
    if (!state.sessions[date]) {
      updateSessions(ss => ({ ...ss, [date]: { courtHire: 0, attendance: {} } }));
      return { courtHire: 0, attendance: {} };
    }
    return state.sessions[date];
  }
  function setCourtHire(date, value) {
    updateSessions(ss => ({
      ...ss,
      [date]: { courtHire: value, attendance: (ss[date] && ss[date].attendance) || {} },
    }));
  }
  function toggleAttendance(date, personId) {
    updateSessions(ss => {
      const cur = ss[date] || { courtHire: 0, attendance: {}, payments: {} };
      const att = { ...cur.attendance };
      att[personId] = !att[personId];
      const pay = { ...(cur.payments || {}) };
      // if no longer attending, clear paid flag
      if (!att[personId]) delete pay[personId];
      return { ...ss, [date]: { ...cur, attendance: att, payments: pay } };
    });
  }
  function togglePayment(date, personId) {
    updateSessions(ss => {
      const cur = ss[date] || { courtHire: 0, attendance: {}, payments: {} };
      const pay = { ...(cur.payments || {}) };
      pay[personId] = !pay[personId];
      return { ...ss, [date]: { ...cur, payments: pay, attendance: cur.attendance || {} } };
    });
  }
  function markAllAttended(date, personIds, value) {
    updateSessions(ss => {
      const cur = ss[date] || { courtHire: 0, attendance: {} };
      const att = { ...cur.attendance };
      personIds.forEach(id => { att[id] = value; });
      return { ...ss, [date]: { ...cur, attendance: att } };
    });
  }
  function addPerson() {
    const name = newName.trim();
    if (!name) return;
    const id = Math.random().toString(36).slice(2, 10);
    updatePeople(ps => [...ps, { id, name, shuttlePaid: false, days: ['tue', 'wed', 'sat'] }]);
    setNewName('');
    newNameRef.current && newNameRef.current.focus();
  }
  function removePerson(id) {
    updatePeople(ps => ps.filter(p => p.id !== id));
    updateSessions(ss => {
      const out = {};
      for (const k of Object.keys(ss)) {
        const { [id]: _, ...rest } = ss[k].attendance || {};
        out[k] = { ...ss[k], attendance: rest };
      }
      return out;
    });
    updateShuttlecocks(arr => arr.map(s => {
      const { [id]: _, ...rest } = s.payments || {};
      return { ...s, payments: rest };
    }));
  }
  function renamePerson(id, name) {
    updatePeople(ps => ps.map(p => p.id === id ? { ...p, name } : p));
  }
  function toggleShuttle(id) {
    updatePeople(ps => ps.map(p => p.id === id ? { ...p, shuttlePaid: !p.shuttlePaid } : p));
  }
  function toggleLangdon(id) {
    updatePeople(ps => ps.map(p => p.id === id ? { ...p, langdon: !p.langdon } : p));
  }
  function setAllShuttle(paid) {
    updatePeople(ps => ps.map(p => ({ ...p, shuttlePaid: paid })));
  }
  function togglePersonDay(id, dayKey) {
    updatePeople(ps => ps.map(p => {
      if (p.id !== id) return p;
      const has = p.days.includes(dayKey);
      return { ...p, days: has ? p.days.filter(d => d !== dayKey) : [...p.days, dayKey] };
    }));
  }
  function addPersonToDay(personId, dayKey) {
    togglePersonDay(personId, dayKey);
  }
  function toggleDayVisibility(dayKey) {
    setState(s => {
      const hidden = s.hiddenDays || [];
      const has = hidden.includes(dayKey);
      return { ...s, hiddenDays: has ? hidden.filter(d => d !== dayKey) : [...hidden, dayKey] };
    });
  }

  /* week navigation */
  const goToToday = () => setWeekStart(startOfWeek(new Date()));
  const prevWeek = () => setWeekStart(w => addDays(w, -7));
  const nextWeek = () => setWeekStart(w => addDays(w, 7));
  const isCurrentWeek = isoDate(weekStart) === isoDate(startOfWeek(new Date()));

  // Loading screen while fetching from Supabase
  if (!state) {
    return (
      <div className="app">
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '120px 20px', color: 'var(--ink-3)', gap: 12 }}>
          <div style={{ width: 28, height: 28, border: '3px solid var(--line)', borderTopColor: 'var(--ink)', borderRadius: '50%', animation: 'spin 0.7s linear infinite' }} />
          <span>Loading…</span>
        </div>
      </div>
    );
  }

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark">B</div>
          <div>
            <div className="brand-title">Badminton Tracker</div>
            <div className="brand-sub">Tue · Wed · Sat — attendance & cost split</div>
          </div>
        </div>

        <div className="week-controls">
          <div className="week-nav" role="group" aria-label="Week navigation">
            <button onClick={prevWeek} aria-label="Previous week" data-tip="Previous week">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div className="week-label mono">
              {fmtWeekRange(weekStart)}
              {isCurrentWeek && <span className="small">this week</span>}
            </div>
            <button onClick={nextWeek} aria-label="Next week" data-tip="Next week">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
          <button className="today-pill" onClick={goToToday} disabled={isCurrentWeek}>Today</button>
        </div>
      </header>

      <div className="tabs" role="tablist">
        <button className={`tab ${tab === 'sessions' ? 'active' : ''}`} onClick={() => setTab('sessions')} role="tab">
          Sessions
        </button>
        <button className={`tab ${tab === 'roster' ? 'active' : ''}`} onClick={() => setTab('roster')} role="tab">
          People <span className="count mono">{state.people.length}</span>
        </button>
        <button className={`tab ${tab === 'shuttles' ? 'active' : ''}`} onClick={() => setTab('shuttles')} role="tab">
          Shuttlecocks <span className="count mono">{(state.shuttlecocks || []).length}</span>
        </button>
        <button className={`tab ${tab === 'history' ? 'active' : ''}`} onClick={() => setTab('history')} role="tab">
          History
        </button>
      </div>

      {tab === 'sessions' && (
        <SessionsView
          weekStart={weekStart}
          state={state}
          peopleById={peopleById}
          shuttlecocks={state.shuttlecocks || []}
          todayIso={todayIso}
          onSetCourt={setCourtHire}
          onToggleAtt={toggleAttendance}
          onTogglePay={togglePayment}
          onMarkAll={markAllAttended}
          onAddPersonToDay={addPersonToDay}
          onSwitchToRoster={() => setTab('roster')}
          hiddenDays={state.hiddenDays || []}
          onToggleDayVisibility={toggleDayVisibility}
        />
      )}

      {tab === 'roster' && (
        <RosterView
          people={state.people}
          shuttlecocks={state.shuttlecocks || []}
          sessions={state.sessions || {}}
          newName={newName}
          setNewName={setNewName}
          newNameRef={newNameRef}
          onAdd={addPerson}
          onRemove={removePerson}
          onRename={renamePerson}
          onToggleShuttle={toggleShuttle}
          onToggleLangdon={toggleLangdon}
          onSetAllShuttle={setAllShuttle}
          onToggleDay={togglePersonDay}
        />
      )}

      {tab === 'shuttles' && (
        <ShuttlecocksView
          shuttlecocks={state.shuttlecocks || []}
          people={state.people}
          sessions={state.sessions}
          onAdd={addShuttlecock}
          onRemove={removeShuttlecock}
          onUpdate={updateShuttlecockField}
          onTogglePayment={toggleShuttlecockPayment}
          onAddPerson={addPersonToShuttlecock}
          onRemovePerson={removePersonFromShuttlecock}
        />
      )}

      {tab === 'history' && (
        <HistoryView
          sessions={state.sessions || {}}
          people={state.people}
          shuttlecocks={state.shuttlecocks || []}
        />
      )}
    </div>
  );
}

/* ───── Status filter (All / Paid / Unpaid) ───── */
function StatusFilter({ value, onChange }) {
  const opts = [
    { key: 'all', label: 'All' },
    { key: 'unpaid', label: 'Outstanding' },
    { key: 'paid', label: 'Fully paid' },
  ];
  return (
    <div className="status-filter" role="radiogroup" aria-label="Filter by payment status">
      {opts.map(o => (
        <button
          key={o.key}
          className={`status-chip ${value === o.key ? 'on' : ''}`}
          onClick={() => onChange(o.key)}
          role="radio"
          aria-checked={value === o.key}
        >
          {o.label}
        </button>
      ))}
    </div>
  );
}

/* ───── Sessions view ───── */
function SessionsView({ weekStart, state, peopleById, shuttlecocks, todayIso, onSetCourt, onToggleAtt, onTogglePay, onMarkAll, onAddPersonToDay, onSwitchToRoster, hiddenDays, onToggleDayVisibility }) {
  const [statusFilter, setStatusFilter] = React.useState('all'); // 'all' | 'paid' | 'unpaid'
  const visibleDays = DAYS.filter(d => !hiddenDays.includes(d.key));
  const dayInfos = visibleDays.map(d => {
    const date = dateForDayOfWeek(weekStart, d.dow);
    const iso = isoDate(date);
    const session = state.sessions[iso] || { courtHire: 0, attendance: {} };
    const roster = state.people.filter(p => p.days.includes(d.key));
    const attendees = roster.filter(p => session.attendance[p.id]);
    const baseSplit = attendees.length > 0 && session.courtHire > 0
      ? session.courtHire / attendees.length : 0;
    const total = attendees.length > 0 ? (Number(session.courtHire) || 0) : 0;
    const surchargeCount = attendees.filter(p => !p.langdon && !isCoveredOn(p.id, iso, shuttlecocks)).length;
    const surchargeTotal = surchargeCount * SHUTTLE_SURCHARGE;
    const payments = session.payments || {};
    const paidAttendees = attendees.filter(p => payments[p.id]);
    const paidCount = paidAttendees.length;
    const paidAmount = paidAttendees.reduce((sum, p) => sum + baseSplit, 0);
    return { ...d, date, iso, session, roster, attendees, baseSplit, total, paidCount, paidAmount, surchargeCount, surchargeTotal };
  });

  const filteredDayInfos = dayInfos.filter(di => {
    if (statusFilter === 'all') return true;
    const isFullyPaid = di.attendees.length > 0 && di.paidCount === di.attendees.length;
    if (statusFilter === 'paid') return isFullyPaid;
    if (statusFilter === 'unpaid') return di.attendees.length > 0 && !isFullyPaid;
    return true;
  });

  const weekTotal = dayInfos.reduce((s, di) => s + di.total, 0);
  const weekCourt = dayInfos.reduce((s, di) => s + (di.attendees.length > 0 ? Number(di.session.courtHire) || 0 : 0), 0);
  const weekAttendees = dayInfos.reduce((s, di) => s + di.attendees.length, 0);
  const weekSurcharge = dayInfos.reduce((s, di) => s + (di.surchargeTotal || 0), 0);
  const weekSurchargeCount = dayInfos.reduce((s, di) => s + (di.surchargeCount || 0), 0);

  return (
    <>
      <div className="day-filters">
        <div className="day-filters-group">
          <span className="day-filters-label">Show</span>
          {DAYS.map(d => {
            const on = !hiddenDays.includes(d.key);
            return (
              <button
                key={d.key}
                className={`day-filter-chip ${on ? 'on' : ''}`}
                onClick={() => onToggleDayVisibility(d.key)}
                aria-pressed={on}
              >
                {d.label}
              </button>
            );
          })}
        </div>
        <StatusFilter value={statusFilter} onChange={setStatusFilter} />
      </div>
      <div className={`sessions cols-${Math.max(1, filteredDayInfos.length)}`}>
        {filteredDayInfos.length === 0 ? (
          <div className="filter-empty">
            {statusFilter === 'paid' ? 'No fully-paid sessions this week.' : 'No outstanding sessions this week.'}
          </div>
        ) : filteredDayInfos.map(di => (
          <DayCard
            key={di.iso}
            di={di}
            allPeople={state.people}
            peopleById={peopleById}
            shuttlecocks={shuttlecocks}
            isToday={di.iso === todayIso}
            isPast={di.iso < todayIso}
            onSetCourt={onSetCourt}
            onToggleAtt={onToggleAtt}
            onTogglePay={onTogglePay}
            onMarkAll={onMarkAll}
            onAddPersonToDay={onAddPersonToDay}
            onSwitchToRoster={onSwitchToRoster}
          />
        ))}
      </div>

      <div className="week-summary">
        <div className="ws-item">
          <span className="label">Week total</span>
          <span className="value mono">{money(weekTotal)}</span>
        </div>
        <div className="ws-item">
          <span className="label">Court hire</span>
          <span className="value mono">{money(weekCourt)}</span>
        </div>
        <div className="ws-item">
          <span className="label">Player-sessions</span>
          <span className="value mono">{weekAttendees}</span>
        </div>
        {weekSurchargeCount > 0 && (
          <div className="ws-item">
            <span className="label" style={{ color: 'var(--warn)' }}>incl. +${SHUTTLE_SURCHARGE} × {weekSurchargeCount}</span>
            <span className="value mono" style={{ color: 'var(--warn)' }}>+{money(weekSurcharge)}</span>
          </div>
        )}
        <div className="ws-spacer" />
        <div className="ws-note mono">+{money(SHUTTLE_SURCHARGE)} shuttle surcharge applies on sessions not covered by a shuttlecock card</div>
      </div>
    </>
  );
}

/* ───── Day card ───── */
function DayCard({ di, allPeople, peopleById, shuttlecocks, isToday, isPast, onSetCourt, onToggleAtt, onTogglePay, onMarkAll, onAddPersonToDay, onSwitchToRoster }) {
  const [courtStr, setCourtStr] = useState(String(di.session.courtHire || ''));
  const [showAdd, setShowAdd] = useState(false);

  useEffect(() => {
    setCourtStr(di.session.courtHire ? String(di.session.courtHire) : '');
  }, [di.iso, di.session.courtHire]);

  const onCourtChange = (e) => {
    const v = e.target.value.replace(/[^\d.]/g, '');
    setCourtStr(v);
    onSetCourt(di.iso, parseFloat(v) || 0);
  };

  const allOn = di.roster.length > 0 && di.attendees.length === di.roster.length;
  const fullyPaid = di.attendees.length > 0 && di.paidCount === di.attendees.length;
  const handleToggleAll = () => {
    onMarkAll(di.iso, di.roster.map(p => p.id), !allOn);
  };

  const tag = isToday ? 'today' : (isPast ? 'past' : 'upcoming');
  const tagLabel = isToday ? 'Today' : (isPast ? 'Past' : di.date.toLocaleDateString(undefined, { weekday: 'short' }).toUpperCase());

  // people not yet in roster (for quick-add)
  const eligibleToAdd = allPeople.filter(p => !p.days.includes(di.key));

  return (
    <section className={`day-card ${isToday ? 'is-today' : ''} ${isPast ? 'is-past' : ''} ${fullyPaid ? 'is-fully-paid' : ''}`} data-screen-label={`${di.label} ${di.iso}`}>
      {fullyPaid && <div className="fully-paid-banner">FULLY PAID</div>}
      <div className="day-head">
        <div>
          <div className="day-name">{di.label}</div>
          <div className="day-date mono">{fmtMonthDay(di.date)}</div>
        </div>
        <span className={`day-tag ${isToday ? 'today' : ''} ${isPast ? 'past' : ''}`}>
          {tagLabel}
        </span>
      </div>

      <div className="court-row">
        <label htmlFor={`court-${di.iso}`}>Court hire</label>
        <div className="court-input-wrap">
          <span className="prefix">$</span>
          <input
            id={`court-${di.iso}`}
            className="court-input"
            type="text"
            inputMode="decimal"
            value={courtStr}
            onChange={onCourtChange}
            placeholder="0.00"
          />
        </div>
      </div>

      {di.roster.length > 0 && (
        <div className="court-row" style={{ display: 'none' }}/>
      )}

      <ul className="roster-list">
        {di.roster.length === 0 && (
          <li className="roster-empty">
            No one on the {di.label} roster yet.<br/>
            <button onClick={onSwitchToRoster}>Manage people →</button>
          </li>
        )}
        {di.roster.map(p => {
          const attended = !!di.session.attendance[p.id];
          const paid = !!(di.session.payments && di.session.payments[p.id]);
          const covered = isCoveredOn(p.id, di.iso, shuttlecocks);
          const exempt = p.langdon || covered;
          const personCost = attended ? di.baseSplit + (exempt ? 0 : SHUTTLE_SURCHARGE) : 0;
          return (
            <li key={p.id} className={`roster-item ${attended ? 'attended' : ''} ${paid ? 'is-paid' : ''}`}>
              <button
                className={`check ${attended ? 'on' : ''}`}
                onClick={() => onToggleAtt(di.iso, p.id)}
                aria-pressed={attended}
                aria-label={`Toggle attendance for ${p.name}`}
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </button>
              <div className={`person-name ${attended ? '' : 'dim'}`}>
                {p.name}
                {!exempt && (
                  <span className="shuttle-flag" data-tip="No active shuttlecock coverage · +$2 surcharge">
                    +$2
                  </span>
                )}
                {p.langdon && <span className="shuttle-flag" style={{ background: '#e8f0fe', color: '#1a56db' }}>Langdon</span>}
              </div>
              <div className={`person-cost ${attended ? '' : 'dim'}`}>
                {attended ? money(personCost) : '—'}
                {attended && !exempt && <span className="surcharge">incl. +${SHUTTLE_SURCHARGE}</span>}
              </div>
              <button
                className={`pay-check ${paid ? 'on' : ''} ${attended ? '' : 'muted'}`}
                onClick={() => onTogglePay(di.iso, p.id)}
                aria-pressed={paid}
                disabled={!attended}
                data-tip={!attended ? 'Mark attended first' : (paid ? 'Paid · click to unmark' : 'Mark as paid')}
                aria-label={`Toggle paid for ${p.name}`}
              >
                {paid ? (
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                ) : (
                  <span className="pay-dash">$</span>
                )}
              </button>
            </li>
          );
        })}
      </ul>

      {di.roster.length > 0 && (
        <div className="day-actions" style={{ borderTop: '1px solid var(--line)', borderBottom: 0 }}>
          <button className="day-action" onClick={handleToggleAll}>
            {allOn ? 'Clear attendance' : 'Mark all attended'}
          </button>
          {eligibleToAdd.length > 0 && (
            <div style={{ position: 'relative' }}>
              <button className="day-action" onClick={() => setShowAdd(v => !v)}>
                + Add player
              </button>
              {showAdd && (
                <QuickAddDropdown
                  people={eligibleToAdd}
                  onPick={(id) => { onAddPersonToDay(id, di.key); setShowAdd(false); }}
                  onClose={() => setShowAdd(false)}
                />
              )}
            </div>
          )}
        </div>
      )}

      <div className="day-foot">
        <span className="label">Attendees</span>
        <span className="value mono">{di.attendees.length}</span>
        <span className="label">Base split</span>
        <span className="value mono">{di.attendees.length > 0 && di.session.courtHire > 0 ? money(di.baseSplit) : '—'}</span>
        <span className="label">Paid</span>
        <span className="value mono">{di.paidCount} / {di.attendees.length} · {money(di.paidAmount)}</span>
        <span className="label">Day total</span>
        <span className="value big mono">{money(di.total)}</span>
        {di.surchargeCount > 0 && (
          <>
            <span className="label" style={{ color: 'var(--warn)' }}>incl. +${SHUTTLE_SURCHARGE} × {di.surchargeCount}</span>
            <span className="value mono" style={{ color: 'var(--warn)' }}>+{money(di.surchargeTotal)}</span>
          </>
        )}
      </div>
    </section>
  );
}

function OwedPopover({ title, children, onClose, onMouseEnter, onMouseLeave }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [onClose]);
  return (
    <div ref={ref} className="owed-popover" onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}>
      <div className="owed-popover-title">{title}</div>
      <div className="owed-popover-body">{children}</div>
    </div>
  );
}

/* ───── Roster (people management) view ───── */
function RosterView({ people, shuttlecocks, sessions, newName, setNewName, newNameRef, onAdd, onRemove, onRename, onToggleShuttle, onToggleLangdon, onSetAllShuttle, onToggleDay }) {
  const allPaid = people.length > 0 && people.every(p => p.shuttlePaid);
  // Derive each person's current shuttle coverage based on today + shuttlecocks.
  // Used for display only — actual surcharge decisions happen per-session.
  const todayIso = isoDate(new Date());
  const coveredById = Object.fromEntries(people.map(p => [p.id, isCoveredOn(p.id, todayIso, shuttlecocks || [])]));

  // Per-person outstanding totals.
  // Sessions owed: sum of (baseSplit + surcharge) across attended-but-unpaid sessions.
  // Shuttle owed: sum of per-card split across cards person is on but hasn't paid.
  // Per-person outstanding totals + per-row breakdowns for the popover.
  const sessionOwed = Object.fromEntries(people.map(p => [p.id, 0]));
  const sessionOwedItems = Object.fromEntries(people.map(p => [p.id, []]));
  const sortedSessionDates = Object.keys(sessions || {}).sort();
  for (const date of sortedSessionDates) {
    const sess = sessions[date] || {};
    const att = sess.attendance || {};
    const pays = sess.payments || {};
    const attendedIds = Object.keys(att).filter(pid => att[pid] && people.some(p => p.id === pid));
    const ct = attendedIds.length;
    if (ct === 0) continue;
    const courtHire = Number(sess.courtHire) || 0;
    const baseSplit = courtHire > 0 ? courtHire / ct : 0;
    const [Y, M, D] = date.split('-').map(Number);
    const dow = new Date(Y, M - 1, D).getDay();
    const dayShort = (DAYS.find(d => d.dow === dow) || {}).short || '';
    for (const pid of attendedIds) {
      if (pays[pid]) continue;
      const person = people.find(p => p.id === pid);
      const sur = (person && person.langdon) ? 0 : (isCoveredOn(pid, date, shuttlecocks || []) ? 0 : SHUTTLE_SURCHARGE);
      const total = baseSplit + sur;
      if (total > 0) {
        sessionOwed[pid] = (sessionOwed[pid] || 0) + total;
        sessionOwedItems[pid].push({ date, dayShort, base: baseSplit, surcharge: sur, total });
      }
    }
  }
  const shuttleOwed = Object.fromEntries(people.map(p => [p.id, 0]));
  const shuttleOwedItems = Object.fromEntries(people.map(p => [p.id, []]));
  for (const s of (shuttlecocks || [])) {
    const ids = s.personIds || people.map(p => p.id);
    const cardPeople = ids.filter(pid => people.some(p => p.id === pid));
    if (cardPeople.length === 0) continue;
    const cost = Number(s.cost) || 0;
    const applied = Number(s.appliedSurcharge) || 0;
    const remaining = Math.max(0, cost - applied);
    if (remaining === 0) continue;
    const split = remaining / cardPeople.length;
    const pays = s.payments || {};
    for (const pid of cardPeople) {
      if (pays[pid]) continue;
      shuttleOwed[pid] = (shuttleOwed[pid] || 0) + split;
      shuttleOwedItems[pid].push({ name: s.name || 'Shuttlecock', date: s.date || '', share: split });
    }
  }

  const [openCell, setOpenCell] = React.useState(null); // {pid, kind:'sessions'|'shuttles'}
  const hoverTimer = React.useRef(null);
  const openHover = (pid, kind) => { if (hoverTimer.current) { clearTimeout(hoverTimer.current); hoverTimer.current = null; } setOpenCell({ pid, kind }); };
  const closeHover = () => { if (hoverTimer.current) clearTimeout(hoverTimer.current); hoverTimer.current = setTimeout(() => setOpenCell(null), 120); };
  const [focusedId, setFocusedId] = React.useState(null);
  const focusedPerson = focusedId ? people.find(p => p.id === focusedId) : null;
  React.useEffect(() => { if (focusedId && !people.some(p => p.id === focusedId)) setFocusedId(null); }, [people, focusedId]);
  return (
    <div className="roster-panel">
      <div className="roster-panel-head">
        <div>
          <h2>People</h2>
          <p>Add or remove players, set their regular days, and track shuttle payments.</p>
        </div>
        {people.length > 0 && (
          <span style={{ fontSize: 11.5, color: 'var(--ink-3)', alignSelf: 'flex-start', maxWidth: 260, textAlign: 'right', lineHeight: 1.4 }}>
            Shuttle coverage is derived from each person’s presence on the most recent shuttlecock card.
          </span>
        )}
      </div>

      {focusedPerson && (
        <div className="focus-banner">
          <span>Focused on <strong>{focusedPerson.name}</strong></span>
          <button className="focus-banner-clear" onClick={() => setFocusedId(null)}>× Show all</button>
        </div>
      )}

      <div className="add-person">
        <input
          ref={newNameRef}
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') onAdd(); }}
          placeholder="Add a player by name…"
        />
        <button onClick={onAdd} disabled={!newName.trim()}>Add</button>
      </div>

      {people.length === 0 ? (
        <div style={{ padding: '40px 20px', textAlign: 'center', color: 'var(--ink-3)', fontSize: 13 }}>
          No players yet — add the first one above.
        </div>
      ) : (
        <table className="people-table">
          <thead>
            <tr>
              <th>Name</th>
              <th className="center" style={{ width: 180 }}>Regular days</th>
              <th className="center" style={{ width: 100 }}>Langdon</th>
              <th className="center" style={{ width: 170 }}>Shuttle coverage</th>
              <th className="right" style={{ width: 120 }}>Owes (sessions)</th>
              <th className="right" style={{ width: 130 }}>Owes (shuttles)</th>
              <th className="right" style={{ width: 110 }}>Total owed</th>
              <th style={{ width: 60 }}></th>
            </tr>
          </thead>
          <tbody>
            {people.map(p => {
              const isFocused = focusedId === p.id;
              const isDimmed = focusedId && !isFocused;
              return (
              <tr key={p.id} className={`${isFocused ? 'row-focused' : ''} ${isDimmed ? 'row-dimmed' : ''}`}>
                <td className="name-cell">
                  <button
                    className={`focus-dot ${isFocused ? 'on' : ''}`}
                    onClick={() => setFocusedId(isFocused ? null : p.id)}
                    title={isFocused ? 'Show everyone' : `Isolate ${p.name || 'this player'}`}
                    aria-pressed={isFocused}
                  />
                  <input
                    value={p.name}
                    onChange={(e) => onRename(p.id, e.target.value)}
                    placeholder="Name"
                  />
                </td>
                <td>
                  <div className="day-toggles">
                    {DAYS.map(d => (
                      <button
                        key={d.key}
                        className={`day-chip ${p.days.includes(d.key) ? 'on' : ''}`}
                        onClick={() => onToggleDay(p.id, d.key)}
                        data-tip={`${p.days.includes(d.key) ? 'Remove from' : 'Add to'} ${d.label}`}
                      >
                        {d.short}
                      </button>
                    ))}
                  </div>
                </td>
                <td style={{ textAlign: 'center' }}>
                  <button
                    className={`day-chip ${p.langdon ? 'on' : ''}`}
                    onClick={() => onToggleLangdon(p.id)}
                    style={{ width: 'auto', height: 'auto', padding: '5px 10px', fontSize: 11, display: 'inline-flex', alignItems: 'center', gap: 3 }}
                    data-tip={p.langdon ? 'Exempt from +$2' : 'Mark exempt from +$2'}
                  >
                    {p.langdon ? '✓ Langdon' : 'Langdon'}
                  </button>
                </td>
                <td style={{ textAlign: 'center' }}>
                  <span className={`coverage-badge ${(p.langdon || coveredById[p.id]) ? 'on' : 'off'}`} title={p.langdon ? 'Langdon — exempt from +$2' : (coveredById[p.id] ? 'Currently on the most recent shuttlecock card' : 'Not on the most recent shuttlecock card — +$2 applies to their sessions')}>
                    {p.langdon ? 'Exempt (Langdon)' : (coveredById[p.id] ? 'Covered' : 'Not covered (+$2)')}
                  </span>
                </td>
                <td
                  className="owed-cell mono"
                  style={{ textAlign: 'right', position: 'relative' }}
                  onMouseEnter={() => (sessionOwed[p.id] || 0) > 0 && openHover(p.id, 'sessions')}
                  onMouseLeave={closeHover}
                >
                  {(sessionOwed[p.id] || 0) > 0 ? (
                    <button className="owed-btn owed-amount" onClick={() => setOpenCell(o => o && o.pid === p.id && o.kind === 'sessions' ? null : { pid: p.id, kind: 'sessions' })}>
                      {money(sessionOwed[p.id])}
                    </button>
                  ) : <span className="owed-zero">{money(0)}</span>}
                  {openCell && openCell.pid === p.id && openCell.kind === 'sessions' && (
                    <OwedPopover title={`${p.name} — unpaid sessions`} onClose={() => setOpenCell(null)} onMouseEnter={() => openHover(p.id, 'sessions')} onMouseLeave={closeHover}>
                      {sessionOwedItems[p.id].map((it, i) => (
                        <div key={i} className="owed-row">
                          <span className="owed-row-label">{it.dayShort} · {it.date.split('-').reverse().join('/')}</span>
                          <span className="owed-row-amt mono">
                            {money(it.total)}
                            {it.surcharge > 0 && <span className="owed-row-sur"> (incl. +${it.surcharge})</span>}
                          </span>
                        </div>
                      ))}
                    </OwedPopover>
                  )}
                </td>
                <td
                  className="owed-cell mono"
                  style={{ textAlign: 'right', position: 'relative' }}
                  onMouseEnter={() => (shuttleOwed[p.id] || 0) > 0 && openHover(p.id, 'shuttles')}
                  onMouseLeave={closeHover}
                >
                  {(shuttleOwed[p.id] || 0) > 0 ? (
                    <button className="owed-btn owed-amount" onClick={() => setOpenCell(o => o && o.pid === p.id && o.kind === 'shuttles' ? null : { pid: p.id, kind: 'shuttles' })}>
                      {money(shuttleOwed[p.id])}
                    </button>
                  ) : <span className="owed-zero">{money(0)}</span>}
                  {openCell && openCell.pid === p.id && openCell.kind === 'shuttles' && (
                    <OwedPopover title={`${p.name} — unpaid shuttlecocks`} onClose={() => setOpenCell(null)} onMouseEnter={() => openHover(p.id, 'shuttles')} onMouseLeave={closeHover}>
                      {shuttleOwedItems[p.id].map((it, i) => (
                        <div key={i} className="owed-row">
                          <span className="owed-row-label">{it.name}{it.date ? ` · ${it.date}` : ''}</span>
                          <span className="owed-row-amt mono">{money(it.share)}</span>

                      <path d="M10 11v6M14 11v6"/>
                      <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
